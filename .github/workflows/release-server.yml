name: Release Server Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A linker_messages"

jobs:
  build-server:
    name: Server Binary (${{ matrix.arch_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch_name: amd64
            use_cross: false

          - target: aarch64-unknown-linux-musl
            arch_name: arm64
            use_cross: true

          - target: armv7-unknown-linux-musleabihf
            arch_name: armv7
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Musl Tools & Fast Cross Binary
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            if ! command -v cross &> /dev/null; then
              wget -qO- https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
            fi
          fi

      - name: Build Server Binary (x86_64 musl)
        if: matrix.use_cross == false
        run: |
          cd src-tauri
          cargo build --target ${{ matrix.target }} --release --no-default-features --features server

      - name: Build Server Binary (Cross ARM64 / ARMv7)
        if: matrix.use_cross == true
        run: |
          cd src-tauri
          cross build --target ${{ matrix.target }} --release --no-default-features --features server

      - name: Prepare Server Binary Artifact
        run: |
          mkdir -p build_output
          BIN_NAME="livedownloader-server-linux-${{ matrix.arch_name }}"
          cp src-tauri/target/${{ matrix.target }}/release/LiveDownloader "build_output/${BIN_NAME}"
          chmod +x "build_output/${BIN_NAME}"

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: livedownloader-server-linux-${{ matrix.arch_name }}
          path: build_output/livedownloader-server-linux-${{ matrix.arch_name }}

  publish-server-release:
    name: Publish Server Release
    needs: build-server
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(jq -r .version src-tauri/tauri.conf.json)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Download all server artifacts
        uses: actions/download-artifact@v4
        with:
          path: server-binaries
          pattern: livedownloader-server-linux-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la server-binaries/

      - name: Create or Update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          if gh release view "${TAG}" &>/dev/null; then
            echo "Release ${TAG} exists. Uploading server binaries..."
            gh release upload "${TAG}" server-binaries/livedownloader-server-linux-* --clobber
          else
            echo "Creating new release ${TAG} for server binaries..."
            gh release create "${TAG}" server-binaries/livedownloader-server-linux-* \
              --title "LiveDownloader ${TAG}" \
              --notes "LiveDownloader Linux Server Binaries (${TAG})"
          fi
