name: Build & Release (Server + Desktop GUI)

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-A linker_messages"

jobs:
  # ============================================================================
  # 1. Server Binary Build Job (runs first, artifacts only)
  # ============================================================================
  build-server:
    name: Server Binary (${{ matrix.arch_name }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            arch_name: amd64
            use_cross: false

          - target: aarch64-unknown-linux-musl
            arch_name: arm64
            use_cross: true

          - target: armv7-unknown-linux-musleabihf
            arch_name: armv7
            use_cross: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Musl Tools & Fast Cross Binary
        run: |
          sudo apt-get update && sudo apt-get install -y musl-tools
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            if ! command -v cross &> /dev/null; then
              wget -qO- https://github.com/cross-rs/cross/releases/latest/download/cross-x86_64-unknown-linux-musl.tar.gz | tar xz -C ~/.cargo/bin
            fi
          fi

      - name: Build Server Binary (x86_64 musl)
        if: matrix.use_cross == false
        run: |
          cd src-tauri
          cargo build --target ${{ matrix.target }} --release --no-default-features --features server

      - name: Build Server Binary (Cross ARM64 / ARMv7)
        if: matrix.use_cross == true
        run: |
          cd src-tauri
          cross build --target ${{ matrix.target }} --release --no-default-features --features server

      - name: Prepare Server Binary Artifact
        run: |
          mkdir -p build_output
          BIN_NAME="livedownloader-server-linux-${{ matrix.arch_name }}"
          cp src-tauri/target/${{ matrix.target }}/release/LiveDownloader "build_output/${BIN_NAME}"
          chmod +x "build_output/${BIN_NAME}"

      - name: Upload Server Artifact
        uses: actions/upload-artifact@v4
        with:
          name: livedownloader-server-linux-${{ matrix.arch_name }}
          path: build_output/livedownloader-server-linux-${{ matrix.arch_name }}

  # ============================================================================
  # 2. Desktop GUI Build Job (runs concurrently alongside server builds)
  # ============================================================================
  build-desktop:
    name: Desktop GUI (${{ matrix.platform }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            platform: windows-amd64
            args: ""

          - os: macos-latest
            platform: macos-universal
            args: "--target universal-apple-darwin"

          - os: ubuntu-latest
            platform: linux-amd64
            args: ""

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(jq -r .version src-tauri/tauri.conf.json)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-universal' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri -> target

      - name: Install Linux Desktop Dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev patchelf libxdo-dev libssl-dev libgtk-3-dev
          sudo ln -sf /usr/lib/x86_64-linux-gnu/pkgconfig/ayatana-appindicator3-0.1.pc /usr/lib/x86_64-linux-gnu/pkgconfig/appindicator3-0.1.pc || true

      - name: Install Frontend Dependencies
        run: npm ci || npm install

      - name: Build Desktop Application (Tauri Action)
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ steps.release_tag.outputs.tag }}
          releaseName: 'LiveDownloader v__VERSION__'
          releaseBody: 'See the assets below to download LiveDownloader Desktop App or Server Binary for your platform.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}

  # ============================================================================
  # 3. Upload Server Binaries to the GitHub Release (after both jobs complete)
  # ============================================================================
  upload-server-release:
    name: Attach Server Binaries to Release
    needs: [build-server, build-desktop]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Determine Release Tag
        id: release_tag
        shell: bash
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            echo "tag=${{ github.ref_name }}" >> $GITHUB_OUTPUT
          else
            VERSION=$(jq -r .version src-tauri/tauri.conf.json)
            echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          fi

      - name: Download all server artifacts
        uses: actions/download-artifact@v4
        with:
          path: server-binaries
          pattern: livedownloader-server-linux-*
          merge-multiple: true

      - name: List downloaded files
        run: ls -la server-binaries/

      - name: Upload Server Binaries to GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.release_tag.outputs.tag }}"
          echo "Attaching server binaries to release tag: ${TAG}"
          gh release upload "${TAG}" server-binaries/livedownloader-server-linux-* --clobber
